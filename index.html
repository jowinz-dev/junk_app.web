<!Doctype html> 
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible"
    content="IE=edge">
    <meta name="viewport"
    content="width=device-width,initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Producer Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <title>WELCOME TO JUNK APP ^_^ | GROUP L</title>
    <link rel="stylesheet" href="style.css?v=5">
    <!-- Basic Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
</head>
    
<body>
    <header class="header">
        <nav class="navbar">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <a href="#">Interact</a>
        </nav>
        <form action="#" class="search-bar">
            <input type="text" placeholder="Search...">
            <button type="submit"><i class='bx bx-search'></i></button>
        </form>
    </header>
    <div class="container">
        <div class="content">
            <h2><i class="bx bx-sparkles-alt">JUNK APP</h2>
        </div>
        <div class="logreg-box"></div>
    </div>
    <div class="form-container">
    <h2>Log New Waste Collection</h2>
    
    <div class="form-group">
        <label for="waste-type">Waste Type:</label>
        <select id="waste-type">
            <option>Organic / Food Waste</option>
        </select>
    </div>

    <div class="form-group">
        <label for="weight">Weight (kg):</label>
        <input type="text" id="weight" placeholder="e.g., 4.5">
    </div>

    <div class="form-group">
        <label for="location">Location / Unit:</label>
        <input type="text" id="location" placeholder="e.g., Suite B4, Main Building">
    </div>

    <button type="submit">Submit Request</button>
</div>
    <script src="script.js"></script>
</body>
</html>
