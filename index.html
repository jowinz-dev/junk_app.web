<!Doctype html> 
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible"
    content="IE=edge">
    <meta name="viewport"
    content="width=device-width,initial-scale=1.0">
    <title>WELCOME TO JUNK APP ^_^ | GROUP L</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <header class="header">
        <div id="navbar_placeholder"></div>
        <form action="#" class="search-bar">
            <input type="text" placeholder="Search...">
            <button type="submit"><i class='bx bx-search'></i></button>
        </form>
    </header>
    <div class="background"></div>
    <div class="container">
            <div class="content">
                <h1><i class="bx bx-sparkles"></i>JUNK APP</h1>
                <div class="text-sci">
                    <h2>Welcome!<br><span>To our website.</span></h2>
                    <p>Encouraging clean living through digital waste management.</p>
                </div>   
                <div class="social-icons">
                <a href="#"><i class="bx bxl-instagram"></i></a>
                <a href="#"><i class="bx bxl-twitter"></i></a>
                <a href="#"><i class="bx bxl-linkedin-square"></i></a>
                <a href="#"><i class="bx bxl-gmail"></i></a>
                </div>
        </div>
        <div class="logreg-box">
            <div class="form-box login">
                <form action="#">
                    <h2>Sign In</h2>

                    <div class="input-box">
                        <span class="icon"><i class="bx bx-envelope"></i></span>
                        <input type="email" required>
                        <label>Email</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><i class="bx bx-lock"></i></span>
                        <input type="password" required>
                        <label>Password</label>
                    </div>
                    <div class="remember-forgot">
                        <label><input type=checkbox>Remember me</label>
                        <a href="#">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn">Sign In</button>
                    <div class="login-register">
                        <p>Don't have an account?
                        <a href="#" class="register-link">Sign Up</a></p>
                    </div>
                    <div id="g_id_onload"
                        data-client_id="558502091989-sgtp955pvcitrhbo9bug6c0d8gv878po.apps.googleusercontent.com"
                        data-callback="handleCredentialResponse">
                    </div>
                    <div class="g_id_signin"
                        data-type="standard"
                        data-shape="rectangular"
                        data-theme="outline"
                        data-text="sign_in_with"
                        data-size="large"
                        data-logo_alignment="left">
                    </div>
                </form>
            </div>
            <div class="form-box register">
                <form action="#">
                    <h2>Sign Up</h2>
                    <div class="input-box">
                        <span class="icon"><i class="bx bx-user"></i></span>
                        <input type="name" required>
                        <label>Name</label>
                    </div>

                    <div class="input-box">
                        <span class="icon"><i class="bx bx-envelope"></i></span>
                        <input type="email" required>
                        <label>Email</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><i class="bx bx-lock"></i></span>
                        <input type="password" required>
                        <label>Password</label>
                    </div>
                    <div class="input-box" style="margin-bottom: 20px;">
                        <select id="user-role-select" required style="width: 100%; padding: 10px; background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 4px; outline: none;">
                            <option value="" disabled selected style="background: #020410; color: #fff;">Select your role</option>
                            <option value="producer" style="background: #020410; color: #fff;">Basic Waste Producer</option>
                            <option value="collector" style="background: #020410; color: #fff;">Garbage Collector</option>
                        </select>
                    </div>
                    <div class="remember-forgot">
                        <label><input type=checkbox>I agree to the terms and conditions.</label>
                    </div>
                    <button type="submit" class="btn">Sign Up</button>
                    <div class="login-register">
                        <p>Already have an account?
                        <a href="#" class="login-link">Sign In</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <footer>
        <p>Junk App &copy; 2026 | A cleaner environment starts here with you</p>
    </footer>
    <script src="script.js"></script>    
</body>
</html>
