<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset ="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Producer Dashboard</title>
    <link rel="stylesheet" href="waste.css">
</head>
<body>
     <div id="sitenav"></div>    
      <div class="welcome-text-bg">  
    <h2>Welcome back to the Wasteproducer dashboard</h2>
    <p>Manage your waste, track collections and earn rewards for responsible waste sorting.</p>
</div>
    <!-- Recent Collection History Section -->
        <section class="history-box">
        <h3>Recent Collection History</h3>
          <div class="table-container">
          <table class="history-table">
        <thead>
        <tr>
              <th>Date</th>
              <th>Waste Category</th>
              <th>Status</th>
              <th>Points</th>
         </tr>
    </thead>
  <tbody>
     <tr>
       <td colspan="4" class="no-data"></td></td>
     </tr>
  </tbody>
        </table>
    </section>
<!-- Request Box Panel -->
 <section class="request-box">
    <form class="request-form">
    <div class="schedule-row">
      <label for="days">Scheduled pickup days</label>
      <select name="days" id="days">
     <option value="Tuesday">Tuesday</option>
     <option value="Thursday">Thursday</option>
     <option value="Sunday">Sunday</option>
    </select>
</div>
    <button type="submit" class="submit-btn">Submit Collection Request</button>
 </form>
 </section>
</div>
    <!--loging new waste--->
    <section class="log-waste-box">
         <h2>Log New Waste Output</h2>
         <p class="subtitle">Select the waste category and request collection.</p>
         <form class="log-form">
    <div class="form-group">
          <label for="trash">Sorted</label>
          <select name="trash" id="trash">
          <option value="Organic waste">Organic waste (Eg food stuffs)</option>
          <option value="Inorganic waste">Inorganic waste (E.g Plastics, Metals, E-waste, Glass Papers etc)</option>
     </select>
   </div>
<div class="form-group-radio">
 <label class="radio-label">
    <input type="radio" name="waste-category" value="Unsorted">
    <span class="radio-dot"></span>
      Unsorted
   </label>
   </div>
</form>
</section>
  <div id="sitefoot"></div>
</div>
<script src="waste.js"></script>
<script src="script.js"></script> 
</body>
</html>
